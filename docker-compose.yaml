services:
  backend:
    build:
      context: ./GPT_Researcher_backend
    container_name: gptr_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./research.db
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    volumes:
      - ./GPT_Researcher_backend:/app

  frontend:
    build:
      context: ./GPT_Researcher_frontend
    container_name: gptr_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./GPT_Researcher_frontend:/app
  